[project]
name = "komplekt"
version = "1.0.0"
description = "Заявка, прайс и проверяемое коммерческое предложение"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.14.1,<3",
    "python-multipart>=0.0.20,<1",
    "reportlab>=4.4,<5",
    "structlog>=25,<27",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "mypy>=2.1,<3",
    "ruff>=0.15.16,<0.18",
    "import-linter>=2.3,<3",
    "pypdf>=6,<7",
    "pytest-cov>=7,<8",
    "pre-commit>=4,<5",
    "commitizen>=4,<5",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "1.0.0"
tag_format = "v$version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=96"
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "S", "BLE", "C90", "D", "TID", "PLR0911", "PLR0912"]
ignore = ["D104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.ruff.lint.mccabe]
max-complexity = 3

[tool.ruff.lint.pylint]
max-returns = 4
max-branches = 6

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Предметная область не зависит от хранения и веб-приложения"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.storage", "app.web", "app.documents", "app.imports"]

[[tool.importlinter.contracts]]
name = "Разбор CSV не зависит от хранения и интерфейса"
type = "forbidden"
source_modules = ["app.imports"]
forbidden_modules = ["app.storage", "app.web", "app.documents"]

[[tool.importlinter.contracts]]
name = "PDF не зависит от веб-приложения и базы"
type = "forbidden"
source_modules = ["app.documents"]
forbidden_modules = ["app.storage", "app.web", "app.imports"]
